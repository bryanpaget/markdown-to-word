name: Markdown to Word Conversion

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  markdown-to-word:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Combine All Markdown Files
        run: |
          # Build the combined file with frontmatter and one TOC
          cat <<EOF > "$RUNNER_TEMP/combined.md"
          ---
          title: "GCCO"
          subtitle: "Markdown to Word"
          date: "$(date +%Y-%m-%d)"
          version: "v0.0.1"
          ---

          \newpage

          ::: {#toc}
          :::

          \newpage
          EOF

          # Find all .md files, sort them, and for each:
          # - Remove any internal ::: {#toc} blocks
          # - Ensure each file starts with a level-1 heading (if not, add one? We'll just append as-is)
          # - Append to combined.md with a newline separator
          find docs -name "*.md" -not -name "combined.md" -print0 | sort -z | while IFS= read -r -d '' file; do
            echo "" >> "$RUNNER_TEMP/combined.md"
            # Remove any ::: {#toc} ... ::: blocks from the file
            sed -E '/^:::\s*\{#toc\}/,/^:::/d' "$file" >> "$RUNNER_TEMP/combined.md"
            echo "" >> "$RUNNER_TEMP/combined.md"
          done

          # Fix image paths (if any)
          sed -E -i 's|(\.\./)+attachments|attachments|g' "$RUNNER_TEMP/combined.md"

      - name: Convert Markdown to Word
        uses: gccloudone/markdown-to-word@main
        with:
          # Use the title from frontmatter by not overriding it:
          # Either set default_title to match, or remove the input if possible.
          # Let's set it to "GCCO" so it doesn't show [Untitled Document]
          default_title: "GCCO"
          markdown_file: "${{ runner.temp }}/combined.md"
          output_file: "output/markdown-to-word.docx"
          reference_doc: "template/ssc-template-v2.7.dotx"
          classification: "Unclassified | Non classifie"
        env:
          PDF_FILE: ""   # set to generate PDF if needed

      - name: Upload Word Document
        uses: actions/upload-artifact@v7
        with:
          name: markdown-to-word
          path: output/markdown-to-word.docx
          archive: false
