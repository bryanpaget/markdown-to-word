name: Markdown to Word Conversion

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      date:
        description: 'Document date (YYYY-MM-DD) – leave empty for today'
        required: false
        default: ''
      classification:
        description: 'Classification text'
        required: false
        default: 'Unclassified | Non classifie'

jobs:
  markdown-to-word:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set document date
        id: date
        run: |
          if [ -z "${{ github.event.inputs.date }}" ]; then
            echo "doc_date=$(date +%Y-%m-%d)" >> $GITHUB_OUTPUT
          else
            echo "doc_date=${{ github.event.inputs.date }}" >> $GITHUB_OUTPUT
          fi

      - name: Combine All Markdown Files
        run: |
          cat <<EOF > "$RUNNER_TEMP/combined.md"
          ---
          title: "GCCO"
          subtitle: "Markdown to Word"
          date: "${{ steps.date.outputs.doc_date }}"
          version: "v0.0.1"
          ---

          \newpage

          ::: {#toc}
          :::

          \newpage
          EOF
          find docs -name "*.md" -not -name "combined.md" -exec sh -c 'cat "$@"; echo' _ {} + >> "$RUNNER_TEMP/combined.md"
          sed -E -i 's|(\.\./)+attachments|attachments|g' "$RUNNER_TEMP/combined.md"

      - name: Convert Markdown to Word
        uses: gccloudone/markdown-to-word@main   # update to a fixed version later
        with:
          default_title: "[Untitled Document]"
          markdown_file: "${{ runner.temp }}/combined.md"
          output_file: "output/markdown-to-word.docx"
          reference_doc: "template/ssc-template-v2.7.dotx"
          classification: "${{ github.event.inputs.classification || 'Unclassified | Non classifie' }}"
        env:
          PDF_FILE: ""   # set to "output/sample.pdf" if you want PDF output

      - name: Upload Word Document
        uses: actions/upload-artifact@v7
        with:
          name: markdown-to-word
          path: output/markdown-to-word.docx
          archive: false
