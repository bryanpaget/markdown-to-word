name: "Markdown to Word Converter"
description: "Converts a Markdown file to a Word document using Pandoc."
author: "gccloudone"

inputs:
  default_title:
    description: "Default title for the Word document."
    required: true
  markdown_file:
    description: "Path to the Markdown file to be converted."
    required: true
  output_file:
    description: "Path to the output DOCX file."
    required: false
    default: "output/output.docx"
  reference_doc:
    description: "Path to the DOCX reference template."
    required: false
    default: "template/ssc-template-v2.7.dotx"
  classification:
    description: "Classification text for the document header (e.g., 'UNCLASSIFIED | Non classifie')."
    required: false
    default: "Unclassified | Non classifie"

runs:
  using: "composite"
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v5
      with:
        node-version: '24'

    - name: Install Pandoc 3.10 and ditaa
      shell: bash
      run: |
        echo "Installing Pandoc 3.10..."
        wget https://github.com/jgm/pandoc/releases/download/3.10/pandoc-3.10.0.1-1-amd64.deb
        sudo dpkg -i pandoc-3.10.0.1-1-amd64.deb
        pandoc --version

        echo "Installing ditaa (for ASCII diagrams)..."
        sudo apt-get update
        sudo apt-get install -y ditaa

    - name: Install Mermaid CLI
      shell: bash
      run: |
        echo "Installing Mermaid CLI..."
        npm install -g @mermaid-js/mermaid-cli
        mmdc -V

    - name: Install Python Dependencies
      shell: bash
      run: |
        echo "Installing Python dependencies..."
        pip3 install -r "${{ github.action_path }}/requirements.txt"

    - name: Run Markdown to Word Conversion
      shell: bash
      run: |
        "${{ github.action_path }}/convert-to-word.sh" "${{ inputs.default_title }}" \
                                                       "${{ inputs.markdown_file }}" \
                                                       "${{ inputs.output_file }}" \
                                                       "${{ github.action_path }}/${{ inputs.reference_doc }}" \
                                                       "${{ inputs.classification }}"
